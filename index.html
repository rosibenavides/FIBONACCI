<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fibonacci Clinic — Gestión</title>
<style>
  :root{
    --verde-salvia:#66795F;
    --verde-salvia-dark:#57684F;
    --verde-bosque:#3F4C3B;
    --crema:#F8F6F1;
    --blanco:#FFFFFF;
    --texto:#2A322B;
    --texto-suave:#6B7268;
    --terracota:#B5654A;
    --terracota-bg:#FBEDE8;
    --oliva:#8FA283;
    --oliva-bg:#EEF3EB;
    --borde:#E2E0D8;
    --font-serif: Georgia, 'Times New Roman', Times, serif;
    --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; font-family:var(--font-sans); color:var(--texto); background:var(--crema);
    display:flex; min-height:100vh;
  }
  a{ color:inherit; }

  /* Sidebar */
  .sidebar{
    width:230px; flex-shrink:0; background:var(--verde-salvia); color:var(--blanco);
    display:flex; flex-direction:column; padding:28px 0 16px;
  }
  .brand{ padding:0 22px 26px; border-bottom:1px solid rgba(255,255,255,.18); margin-bottom:18px; display:flex; align-items:center; gap:10px; }
  .brand svg{ flex-shrink:0; opacity:.95; }
  .brand-text-title{ font-family:var(--font-serif); font-size:19px; letter-spacing:2px; line-height:1.1; }
  .brand-text-sub{ font-family:var(--font-sans); font-size:10px; letter-spacing:3px; opacity:.85; margin-top:3px; }
  .nav{ list-style:none; margin:0; padding:0; flex:1; }
  .nav-item{
    display:flex; align-items:center; gap:10px; padding:12px 22px; font-size:14px; cursor:pointer;
    color:rgba(255,255,255,.85); border-left:3px solid transparent; transition:background .12s;
  }
  .nav-item:hover{ background:rgba(255,255,255,.08); }
  .nav-item.active{ background:rgba(255,255,255,.14); border-left-color:var(--blanco); color:var(--blanco); font-weight:600; }
  .nav-icon{ width:16px; text-align:center; }
  .sidebar-footer{ padding:14px 22px 0; font-size:11px; color:rgba(255,255,255,.7); border-top:1px solid rgba(255,255,255,.18); margin-top:10px; }
  .sidebar-footer .sf-email{ display:block; color:#fff; font-weight:600; margin-bottom:8px; word-break:break-all; }
  .sidebar-footer .btn{ width:100%; justify-content:center; }

  /* Main */
  .main{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar{
    display:flex; align-items:center; justify-content:space-between; padding:16px 30px;
    background:var(--blanco); border-bottom:1px solid var(--borde);
  }
  .topbar h1{ font-family:var(--font-serif); font-size:22px; margin:0; letter-spacing:.5px; }
  .topbar-title-row{ display:flex; align-items:center; gap:10px; }
  .topbar-actions{ display:flex; align-items:center; gap:14px; }
  .hamburger-btn{ display:none; background:none; border:none; font-size:22px; line-height:1; cursor:pointer; color:var(--verde-bosque); padding:2px 4px; flex-shrink:0; }
  .sidebar-backdrop{ display:none; }
  .sync-status{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--texto-suave); }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--oliva); flex-shrink:0; }
  .sync-dot.syncing{ background:#c9a24a; animation:pulse 1s infinite ease-in-out; }
  .sync-dot.error{ background:var(--terracota); }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  .content{ padding:26px 30px 40px; flex:1; overflow-y:auto; }

  /* Buttons */
  .btn{
    font-family:var(--font-sans); font-size:13px; padding:9px 16px; border-radius:6px; border:1px solid transparent;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; font-weight:600; transition:opacity .12s, background .12s;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--verde-salvia); color:#fff; }
  .btn-primary:hover{ background:var(--verde-salvia-dark); }
  .btn-secondary{ background:var(--blanco); color:var(--verde-bosque); border-color:var(--borde); }
  .btn-secondary:hover{ background:#f1f0ea; }
  .btn-danger{ background:var(--blanco); color:var(--terracota); border-color:#e7cdc3; }
  .btn-danger:hover{ background:var(--terracota-bg); }
  .btn-sm{ padding:5px 10px; font-size:12px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-outline-light{ background:transparent; color:#fff; border-color:rgba(255,255,255,.4); }
  .btn-outline-light:hover{ background:rgba(255,255,255,.1); }

  /* Cards */
  .cards-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px; margin-bottom:24px; }
  .card{ background:var(--blanco); border:1px solid var(--borde); border-radius:10px; padding:18px 20px; }
  .card-label{ font-size:12px; text-transform:uppercase; letter-spacing:1px; color:var(--texto-suave); margin-bottom:8px; }
  .card-value{ font-family:var(--font-serif); font-size:28px; color:var(--verde-bosque); }
  .card-value.negative{ color:var(--terracota); }

  .panel{ background:var(--blanco); border:1px solid var(--borde); border-radius:10px; padding:20px 22px; margin-bottom:22px; }
  .panel-title{ font-family:var(--font-serif); font-size:17px; margin:0 0 14px; color:var(--verde-bosque); }
  .panel-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .panel-header .panel-title{ margin:0; }

  /* Table */
  .table-wrap{ overflow-x:auto; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th{ text-align:left; padding:9px 12px; font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--texto-suave); border-bottom:2px solid var(--borde); white-space:nowrap; }
  td{ padding:10px 12px; border-bottom:1px solid var(--borde); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#faf9f5; }
  td.num, th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .row-actions{ display:flex; gap:6px; justify-content:flex-end; }
  .row-warning{ background:var(--terracota-bg); }
  .row-warning:hover{ background:#f7e2da; }

  /* Badges */
  .badge{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; letter-spacing:.3px; }
  .badge-warning{ background:var(--terracota-bg); color:var(--terracota); }
  .badge-success{ background:var(--oliva-bg); color:#4d6142; }
  .badge-muted{ background:#eee; color:#777; }
  .badge-info{ background:#e8eef7; color:#42618a; }

  .alert{ display:flex; align-items:center; gap:10px; background:var(--terracota-bg); color:#8a4531; border:1px solid #eecdc2; padding:12px 16px; border-radius:8px; margin-bottom:20px; font-size:13.5px; }
  .alert strong{ font-weight:700; }

  .empty-state{ text-align:center; padding:36px 20px; color:var(--texto-suave); font-size:13.5px; }
  .loading-state{ text-align:center; padding:60px 20px; color:var(--texto-suave); font-size:14px; }

  /* Tabs */
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--borde); margin-bottom:18px; }
  .tab{ padding:9px 16px; font-size:13px; cursor:pointer; color:var(--texto-suave); border-bottom:2px solid transparent; font-weight:600; }
  .tab.active{ color:var(--verde-bosque); border-bottom-color:var(--verde-salvia); }

  /* Forms */
  .form-group{ margin-bottom:14px; }
  .form-row{ display:flex; gap:14px; }
  .form-row .form-group{ flex:1; }
  label{ display:block; font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--texto-suave); margin-bottom:5px; font-weight:600; }
  input[type=text], input[type=number], input[type=date], input[type=time], input[type=search], input[type=email], input[type=password],
  select, textarea{
    width:100%; padding:9px 11px; border:1px solid var(--borde); border-radius:6px; font-size:13.5px;
    font-family:var(--font-sans); background:#fff; color:var(--texto);
  }
  textarea{ resize:vertical; min-height:60px; }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--verde-salvia); box-shadow:0 0 0 3px rgba(102,121,95,.15); }
  .hint{ font-size:11.5px; color:var(--texto-suave); margin-top:4px; }
  .search-input{ max-width:260px; }

  .dyn-row{ display:flex; gap:8px; align-items:flex-end; margin-bottom:8px; }
  .dyn-row .form-group{ margin-bottom:0; flex:1; }
  .dyn-row .qty{ max-width:100px; }
  .dyn-remove{ height:38px; }
  .dyn-add{ margin-top:4px; }

  .preview-box{ background:var(--crema); border:1px dashed var(--borde); border-radius:8px; padding:12px 14px; font-size:13px; margin-top:6px; }
  .preview-box .pv-row{ display:flex; justify-content:space-between; padding:3px 0; }
  .preview-box .pv-row.total{ font-weight:700; border-top:1px solid var(--borde); margin-top:6px; padding-top:8px; }
  .pv-pos{ color:#4d6142; }
  .pv-neg{ color:var(--terracota); }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(42,50,43,.45); display:flex; align-items:center; justify-content:center;
    z-index:100; padding:20px;
  }
  .modal-overlay.hidden{ display:none; }
  .modal{ background:#fff; border-radius:12px; width:100%; max-width:520px; max-height:88vh; display:flex; flex-direction:column; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  .modal.wide{ max-width:680px; }
  .modal-header{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--borde); }
  .modal-header h3{ font-family:var(--font-serif); margin:0; font-size:18px; color:var(--verde-bosque); }
  .modal-close-btn{ background:none; border:none; font-size:20px; cursor:pointer; color:var(--texto-suave); line-height:1; }
  .modal-body{ padding:20px 22px; overflow-y:auto; }
  .modal-footer{ display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--borde); }

  /* Bar chart */
  .bar-chart{ display:flex; align-items:flex-end; gap:6px; height:170px; padding:10px 4px 0; overflow-x:auto; }
  .bar-col{ display:flex; flex-direction:column; align-items:center; justify-content:flex-end; min-width:26px; flex:1; height:100%; }
  .bar{ width:100%; max-width:34px; background:var(--verde-salvia); border-radius:4px 4px 0 0; transition:height .2s; }
  .bar-col .bar-val{ font-size:10px; color:var(--texto-suave); margin-bottom:3px; }
  .bar-col .bar-lbl{ font-size:10px; color:var(--texto-suave); margin-top:6px; white-space:nowrap; transform-origin:top center; }

  .week-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
  .week-day{ background:#fff; border:1px solid var(--borde); border-radius:8px; padding:10px; min-height:120px; }
  .week-day-head{ font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--texto-suave); margin-bottom:8px; font-weight:700; }
  .week-day-head.today{ color:var(--verde-salvia); }
  .week-item{ background:var(--crema); border-radius:6px; padding:6px 8px; margin-bottom:6px; font-size:11.5px; cursor:pointer; }
  .week-item .wi-hora{ font-weight:700; }

  .agenda-item{ display:flex; align-items:center; gap:14px; padding:11px 4px; border-bottom:1px solid var(--borde); }
  .agenda-item:last-child{ border-bottom:none; }
  .agenda-hora{ font-family:var(--font-serif); font-size:16px; color:var(--verde-bosque); width:64px; flex-shrink:0; }
  .agenda-info{ flex:1; min-width:0; }
  .agenda-info .ai-paciente{ font-weight:700; font-size:13.5px; }
  .agenda-info .ai-detalle{ font-size:12px; color:var(--texto-suave); }
  .agenda-actions{ display:flex; gap:6px; align-items:center; flex-shrink:0; }

  .hidden{ display:none !important; }
  .text-suave{ color:var(--texto-suave); }
  ::placeholder{ color:#aeb0a8; }

  /* Responsive: teléfonos y pantallas angostas */
  @media (max-width: 860px){
    .hamburger-btn{ display:inline-flex; align-items:center; justify-content:center; }

    .sidebar{
      position:fixed; top:0; left:0; height:100vh; z-index:150; width:82vw; max-width:280px;
      transform:translateX(-100%); transition:transform .22s ease; box-shadow:4px 0 24px rgba(0,0,0,.3);
    }
    .sidebar.open{ transform:translateX(0); }
    .sidebar-backdrop{
      display:block; position:fixed; inset:0; background:rgba(20,24,20,.45); z-index:140;
      opacity:0; pointer-events:none; transition:opacity .22s ease;
    }
    .sidebar-backdrop.open{ opacity:1; pointer-events:auto; }

    .topbar{ flex-direction:column; align-items:stretch; gap:10px; padding:12px 16px; }
    .topbar h1{ font-size:18px; }
    .topbar-actions{ flex-wrap:wrap; gap:8px; }
    .topbar-actions .btn{ padding:8px 10px; font-size:12px; flex:1; justify-content:center; }
    .sync-status{ order:-1; width:100%; }

    .content{ padding:16px 14px 30px; }
    .panel{ padding:16px 14px; }
    .panel-header{ flex-direction:column; align-items:stretch; gap:10px; }
    .panel-header > div{ width:100%; display:flex; flex-wrap:wrap; }
    .search-input{ max-width:none; flex:1; }

    .form-row{ flex-direction:column; gap:0; }
    .cards-grid{ grid-template-columns:repeat(2,1fr); gap:12px; }

    .week-grid{ grid-template-columns:1fr; gap:8px; }
    .week-day{ min-height:auto; }

    .agenda-item{ flex-wrap:wrap; row-gap:8px; }
    .agenda-actions{ width:100%; flex-wrap:wrap; margin-left:78px; }

    .modal{ max-width:100%; max-height:92vh; }
    .modal-body{ padding:16px; }

    .dyn-row{ flex-wrap:wrap; }
  }

  @media (max-width: 480px){
    .btn-label{ display:none; }
    .cards-grid{ grid-template-columns:1fr 1fr; }
    .agenda-actions{ margin-left:0; }
  }

  /* Auth screen */
  .auth-screen{
    position:fixed; inset:0; background:var(--verde-salvia); display:flex; align-items:center; justify-content:center; z-index:200;
  }
  .auth-card{ width:100%; max-width:380px; background:var(--blanco); border-radius:14px; padding:34px 32px 30px; box-shadow:0 30px 80px rgba(0,0,0,.28); }
  .auth-brand{ display:flex; align-items:center; gap:10px; margin-bottom:24px; }
  .auth-brand-title{ font-family:var(--font-serif); font-size:19px; letter-spacing:2px; color:var(--verde-bosque); line-height:1.1; }
  .auth-brand-sub{ font-size:10px; letter-spacing:3px; color:var(--texto-suave); margin-top:3px; }
  .auth-title{ font-family:var(--font-serif); font-size:20px; margin:0 0 6px; color:var(--verde-bosque); }
  .auth-hint{ font-size:12.5px; color:var(--texto-suave); line-height:1.5; margin:0 0 20px; }
  .auth-error{ background:var(--terracota-bg); color:var(--terracota); font-size:12.5px; padding:9px 12px; border-radius:6px; margin-bottom:14px; }
</style>
</head>

/* ---- mapeo fila (snake_case en Supabase) <-> objeto (camelCase en la app) ---- */
function rowToInsumo(r){
  return { id:r.id, nombre:r.nombre, categoria:r.categoria, unidadMedida:r.unidad_medida,
    unidadDosis:r.unidad_dosis || r.unidad_medida,
    stockActual:Number(r.stock_actual), stockMinimo:Number(r.stock_minimo), costoUnitario:Number(r.costo_unitario),
    mermaPorcentaje:Number(r.merma_porcentaje||0),
    contenidoPorEnvase:Number(r.contenido_por_envase||1),
    proveedor:r.proveedor, creadoEn:r.creado_en, actualizadoEn:r.actualizado_en };
}
function rowToMovimiento(r){
  return { id:r.id, insumoId:r.insumo_id, tipo:r.tipo, cantidad:Number(r.cantidad), motivo:r.motivo,
    referenciaId:r.referencia_id, fecha:r.fecha };
}
function rowToTratamientoBase(r){
  return { id:r.id, nombre:r.nombre, descripcion:r.descripcion, tiempoEstimadoMin:Number(r.tiempo_estimado_min),
    precioVenta:Number(r.precio_venta), activo:r.activo, insumosUsados:[] };
}
function rowToPaciente(r){
  return { id:r.id, nombre:r.nombre, telefono:r.telefono, email:r.email, notas:r.notas, creadoEn:r.creado_en };
}
function rowToReserva(r){
  return { id:r.id, pacienteId:r.paciente_id, tratamientoId:r.tratamiento_id, fecha:r.fecha,
    hora:(r.hora||'').slice(0,5), estado:r.estado, notas:r.notas };
}
function rowToVentaBase(r){
  return { id:r.id, fecha:r.fecha, pacienteId:r.paciente_id, metodoPago:r.metodo_pago,
    montoTotal:Number(r.monto_total), reservaId:r.reserva_id, tratamientos:[] };
}

function setSyncStatus(status){
  const dot = document.getElementById('sync-dot');
  const text = document.getElementById('sync-text');
  if(!dot || !text) return;
  dot.className = 'sync-dot' + (status==='syncing' ? ' syncing' : status==='error' ? ' error' : '');
  text.textContent = status==='syncing' ? 'Sincronizando…' : status==='error' ? 'Sin conexión' : 'En línea';
}

async function fetchAll(){
  setSyncStatus('syncing');
  const [insumosR, movR, tratR, triR, pacR, resR, ventR, vtR] = await Promise.all([
    sb.from('insumos').select('*'),
    sb.from('movimientos_inventario').select('*'),
    sb.from('tratamientos').select('*'),
    sb.from('tratamiento_insumos').select('*'),
    sb.from('pacientes').select('*'),
    sb.from('reservas').select('*'),
    sb.from('ventas').select('*'),
    sb.from('venta_tratamientos').select('*'),
  ]);
  const all = [insumosR, movR, tratR, triR, pacR, resR, ventR, vtR];
  const failed = all.find(r=>r.error);
  if(failed){ setSyncStatus('error'); throw failed.error; }

  db.insumos = insumosR.data.map(rowToInsumo);
  db.movimientosInventario = movR.data.map(rowToMovimiento);
  db.pacientes = pacR.data.map(rowToPaciente);
  db.reservas = resR.data.map(rowToReserva);
  db.tratamientos = tratR.data.map(r=>{
    const t = rowToTratamientoBase(r);
    t.insumosUsados = triR.data.filter(x=>x.tratamiento_id===r.id).map(x=>({ insumoId:x.insumo_id, cantidad:Number(x.cantidad) }));
    return t;
  });
  db.ventas = ventR.data.map(r=>{
    const v = rowToVentaBase(r);
    v.tratamientos = vtR.data.filter(x=>x.venta_id===r.id).map(x=>({ tratamientoId:x.tratamiento_id, precio:Number(x.precio) }));
    return v;
  });
  setSyncStatus('online');
}

function subscribeRealtime(){
  if(realtimeChannel) return;
  const tables = ['insumos','movimientos_inventario','tratamientos','tratamiento_insumos','pacientes','reservas','ventas','venta_tratamientos'];
  let channel = sb.channel('db-changes');
  tables.forEach(t=>{
    channel = channel.on('postgres_changes', { event:'*', schema:'public', table:t }, ()=>{
      clearTimeout(realtimeDebounce);
      realtimeDebounce = setTimeout(async ()=>{
        try{ await fetchAll(); render(); }catch(err){ console.error('Error al sincronizar', err); }
      }, 500);
    });
  });
  channel.subscribe();
  realtimeChannel = channel;
}

function unsubscribeRealtime(){
  if(realtimeChannel){ sb.removeChannel(realtimeChannel); realtimeChannel = null; }
}

/* ============================= AUTENTICACIÓN ============================= */
async function initAuth(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await enterApp(session); } else { showAuthScreen(); }

  sb.auth.onAuthStateChange((event, session)=>{
    if(event==='SIGNED_IN' && session){ enterApp(session); }
    else if(event==='SIGNED_OUT'){ unsubscribeRealtime(); showAuthScreen(); }
  });
}

function showAuthScreen(){
  document.getElementById('auth-screen').classList.remove('hidden');
  document.getElementById('app-shell').classList.add('hidden');
}

async function enterApp(session){
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app-shell').classList.remove('hidden');
  document.getElementById('sidebar-user-email').textContent = session.user.email || '';
  document.getElementById('main-content').innerHTML = '<div class="loading-state">Cargando datos…</div>';
  try{
    await fetchAll();
    render();
    subscribeRealtime();
  }catch(err){
    document.getElementById('main-content').innerHTML = '<div class="empty-state">No se pudo conectar con la base de datos. Revisa tu conexión a internet y vuelve a intentar.</div>';
  }
}

document.getElementById('auth-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const errorBox = document.getElementById('auth-error');
  errorBox.classList.add('hidden');
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Ingresando…';
  const { error } = await sb.auth.signInWithPassword({ email: fd.get('email'), password: fd.get('password') });
  btn.disabled = false; btn.textContent = 'Iniciar sesión';
  if(error){
    errorBox.textContent = error.message === 'Invalid login credentials' ? 'Email o contraseña incorrectos.' : error.message;
    errorBox.classList.remove('hidden');
  }
});

/* ============================= UTILS ============================= */
function formatCLP(n){
  n = Number(n) || 0;
  return new Intl.NumberFormat('es-CL', { style:'currency', currency:'CLP', maximumFractionDigits:0 }).format(n);
}
function formatNum(n){ return new Intl.NumberFormat('es-CL').format(Number(n)||0); }

function costoRealUnitario(insumo){
  const merma = Math.min(99, Math.max(0, Number(insumo.mermaPorcentaje) || 0));
  return Number(insumo.costoUnitario) / (1 - merma/100);
}

// Costo real por unidad de USO en tratamientos (ej. por UI), no por unidad de compra (ej. por frasco).
function costoPorDosis(insumo){
  const contenido = Number(insumo.contenidoPorEnvase) || 1;
  return costoRealUnitario(insumo) / contenido;
}

function escapeHtml(str){
  if(str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

function todayLocalISO(){ return toISODateLocal(new Date()); }
function toISODateLocal(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fromISODateLocal(s){
  const [y,m,d] = s.split('-').map(Number);
  return new Date(y, m-1, d);
}
function addDays(d,n){ const r = new Date(d); r.setDate(r.getDate()+n); return r; }
function startOfWeek(d){ const r = new Date(d); const day=(r.getDay()+6)%7; r.setDate(r.getDate()-day); r.setHours(0,0,0,0); return r; }
function formatDateShort(d){ return d.toLocaleDateString('es-CL',{ day:'2-digit', month:'2-digit' }); }
function formatDateLong(d){ return d.toLocaleDateString('es-CL',{ weekday:'long', day:'2-digit', month:'long', year:'numeric' }); }
function weekdayShort(d){ return d.toLocaleDateString('es-CL',{ weekday:'short' }).replace('.',''); }

function byId(arr,id){ return (arr||[]).find(x=>x.id===id); }

/* ============================= RENDER ROOT ============================= */
function render(){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.classList.toggle('active', el.dataset.view === state.view);
  });
  const titles = { dashboard:'Dashboard', inventario:'Inventario de insumos', tratamientos:'Costo de tratamientos', ventas:'Ventas', reservas:'Reserva de pacientes' };
  document.getElementById('view-title').textContent = titles[state.view] || '';
  const main = document.getElementById('main-content');
  main.innerHTML = '';
  if(state.view==='dashboard') renderDashboard(main);
  else if(state.view==='inventario') renderInventario(main);
  else if(state.view==='tratamientos') renderTratamientos(main);
  else if(state.view==='ventas') renderVentas(main);
  else if(state.view==='reservas') renderReservas(main);
}

/* ============================= DASHBOARD ============================= */
function renderDashboard(main){
  const today = todayLocalISO();
  const ventasHoy = db.ventas.filter(v=>v.fecha===today);
  const totalVentasHoy = ventasHoy.reduce((s,v)=>s+Number(v.montoTotal||0),0);
  const reservasHoy = db.reservas.filter(r=>r.fecha===today && r.estado!=='cancelada').sort((a,b)=>a.hora.localeCompare(b.hora));
  const bajosStock = db.insumos.filter(i=>Number(i.stockActual) < Number(i.stockMinimo));

  let html = `<div class="cards-grid">
    <div class="card"><div class="card-label">Ventas hoy</div><div class="card-value">${formatCLP(totalVentasHoy)}</div></div>
    <div class="card"><div class="card-label">Reservas hoy</div><div class="card-value">${reservasHoy.length}</div></div>
    <div class="card"><div class="card-label">Insumos bajo stock mínimo</div><div class="card-value ${bajosStock.length? 'negative':''}">${bajosStock.length}</div></div>
    <div class="card"><div class="card-label">Tratamientos activos</div><div class="card-value">${db.tratamientos.length}</div></div>
  </div>`;

  if(bajosStock.length){
    html += `<div class="alert"><strong>&#9888; ${bajosStock.length} insumo(s) bajo el stock mínimo:</strong> ${bajosStock.map(i=>escapeHtml(i.nombre)).join(', ')}</div>`;
  }

  html += `<div class="panel"><h2 class="panel-title">Agenda de hoy</h2>`;
  if(!reservasHoy.length){
    html += `<div class="empty-state">No hay reservas para hoy.</div>`;
  }else{
    html += reservasHoy.map(r=>agendaItemHtml(r)).join('');
  }
  html += `</div>`;

  main.innerHTML = html;
}

        <input type="search" class="search-input" id="inventario-search" placeholder="Buscar insumo o categoría..." value="${escapeHtml(state.inventarioSearch)}">
        <button class="btn btn-primary" data-action="insumo-new">+ Nuevo insumo</button>

  if(!insumos.length){
    html += `<div class="empty-state">No hay insumos registrados todavía.</div>`;
  }else{
    html += `<div class="table-wrap"><table><thead><tr>
      <th>Nombre</th><th>Categoría</th><th>Unidad de compra</th><th class="num">Contenido</th><th class="num">Stock actual</th><th class="num">Stock mínimo</th>

    </tr></thead><tbody>`;
    insumos.forEach(i=>{
      const bajo = Number(i.stockActual) < Number(i.stockMinimo);
      const merma = Number(i.mermaPorcentaje)||0;
      const contenido = Number(i.contenidoPorEnvase)||1;
      html += `<tr class="${bajo?'row-warning':''}">
        <td>${escapeHtml(i.nombre)} ${bajo? '<span class="badge badge-warning">Stock bajo</span>':''}</td>
        <td>${escapeHtml(i.categoria)}</td>
        <td>${escapeHtml(i.unidadMedida)}</td>
        <td class="num">${contenido>1? formatNum(contenido)+' '+escapeHtml(i.unidadDosis)+'/'+escapeHtml(i.unidadMedida) : escapeHtml(i.unidadDosis)}</td>
        <td class="num">${formatNum(i.stockActual)} ${escapeHtml(i.unidadMedida)}</td>
        <td class="num">${formatNum(i.stockMinimo)}</td>
        <td class="num">${formatCLP(i.costoUnitario)}</td>

          <button class="btn btn-secondary btn-sm" data-action="insumo-edit" data-id="${i.id}">Editar</button>
          <button class="btn btn-danger btn-sm" data-action="insumo-delete" data-id="${i.id}">Eliminar</button>

  }
  html += `</div>`;

  const movs = [...db.movimientosInventario].sort((a,b)=> b.fecha.localeCompare(a.fecha)).slice(0,60);
  html += `<div class="panel"><h2 class="panel-title">Historial de movimientos</h2>`;

}

async function saveAjusteStockForm(form, insumoId){
  const fd = new FormData(form);
  const tipo = fd.get('tipo');
  const cantidad = Number(fd.get('cantidad'));
  const motivo = fd.get('motivo').trim();
  const fecha = fd.get('fecha');
  const insumo = byId(db.insumos, insumoId);
  if(!insumo || cantidad<=0) return;
  if(tipo==='salida' && cantidad > Number(insumo.stockActual)){
    if(!confirm('La cantidad de salida supera el stock actual. ¿Continuar de todas formas?')) return;
  }
  const nuevoStock = Number(insumo.stockActual) + (tipo==='entrada'? cantidad : -cantidad);
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Guardando…';
  try{
    const { error: updErr } = await sb.from('insumos').update({ stock_actual: nuevoStock }).eq('id', insumoId);
    if(updErr) throw updErr;
    const { error: movErr } = await sb.from('movimientos_inventario').insert({ insumo_id:insumoId, tipo, cantidad, motivo, fecha });
    if(movErr) throw movErr;
    await fetchAll(); closeModal(); render();
  }catch(err){
    alert('No se pudo registrar el movimiento: ' + err.message);
  }finally{
    btn.disabled = false; btn.textContent = 'Registrar movimiento';
  }
}

/* ============================= TRATAMIENTOS ============================= */
function calcTratamientoCosto(insumosUsados){
  return (insumosUsados||[]).reduce((sum, iu)=>{
    const insumo = byId(db.insumos, iu.insumoId);
    return sum + (insumo ? costoPorDosis(insumo) * Number(iu.cantidad) : 0);
  }, 0);
}

function renderTratamientos(main){
  const list = db.tratamientos.map(t=>{
    const costoInsumos = calcTratamientoCosto(t.insumosUsados);
    const margen = Number(t.precioVenta) - costoInsumos;
    const margenPct = Number(t.precioVenta) > 0 ? (margen / Number(t.precioVenta) * 100) : 0;
    return Object.assign({}, t, { costoInsumos, margen, margenPct });
  });
  list.sort((a,b)=> state.tratamientosSortDir==='desc' ? b.margenPct - a.margenPct : a.margenPct - b.margenPct);

  let html = `<div class="panel">
    <div class="panel-header">
      <h2 class="panel-title">Tratamientos</h2>
      <button class="btn btn-primary" data-action="tratamiento-new">+ Nuevo tratamiento</button>
    </div>`;

  if(!list.length){
    html += `<div class="empty-state">No hay tratamientos registrados. ${db.insumos.length? '' : 'Primero registra insumos en Inventario.'}</div>`;
  }else{
    html += `<div class="table-wrap"><table><thead><tr>
      <th>Nombre</th><th class="num">Tiempo (min)</th><th class="num">Costo insumos</th><th class="num">Precio venta</th>
      <th class="num">Margen</th><th class="num" style="cursor:pointer;" data-action="tratamiento-sort">Margen % ${state.tratamientosSortDir==='desc'?'&#9660;':'&#9650;'}</th><th></th>
    </tr></thead><tbody>`;
    list.forEach(t=>{
      const badge = t.margenPct < 0 ? 'badge-warning' : (t.margenPct < 30 ? 'badge-muted' : 'badge-success');
      html += `<tr>
        <td>${escapeHtml(t.nombre)}</td>
        <td class="num">${formatNum(t.tiempoEstimadoMin)}</td>
        <td class="num">${formatCLP(t.costoInsumos)}</td>
        <td class="num">${formatCLP(t.precioVenta)}</td>
        <td class="num">${formatCLP(t.margen)}</td>
        <td class="num"><span class="badge ${badge}">${t.margenPct.toFixed(1)}%</span></td>
        <td><div class="row-actions">
          <button class="btn btn-secondary btn-sm" data-action="tratamiento-edit" data-id="${t.id}">Editar</button>
          <button class="btn btn-danger btn-sm" data-action="tratamiento-delete" data-id="${t.id}">Eliminar</button>
        </div></td>
      </tr>`;
    });
    html += `</tbody></table></div>`;
  }
  html += `</div>`;
  main.innerHTML = html;
}

function updateTratamientoPreview(){
  const container = document.getElementById('tr-insumos-rows');
  if(!container) return;
  let costo = 0;
  container.querySelectorAll('[data-row="insumo"]').forEach(row=>{
    const insumoId = row.querySelector('.tr-insumo-select').value;
    const cant = Number(row.querySelector('.tr-insumo-qty').value) || 0;
    const insumo = byId(db.insumos, insumoId);
    if(insumo) costo += costoPorDosis(insumo) * cant;
  });
  const precio = Number(document.getElementById('tr-precio-venta').value) || 0;
  const margen = precio - costo;
  const margenPct = precio>0 ? (margen/precio*100) : 0;
  document.getElementById('tr-preview').innerHTML = `
    <div class="pv-row"><span>Costo total de insumos</span><span>${formatCLP(costo)}</span></div>
    <div class="pv-row total"><span>Margen</span><span class="${margen>=0?'pv-pos':'pv-neg'}">${formatCLP(margen)} (${margenPct.toFixed(1)}%)</span></div>
  `;
}

async function saveTratamientoForm(form, id){
  const fd = new FormData(form);
  const insumoIds = fd.getAll('insumoId[]');
  const cantidades = fd.getAll('cantidadInsumo[]');
  const insumosUsados = [];
  insumoIds.forEach((iid,idx)=>{
    const cant = Number(cantidades[idx]);
    if(iid && cant>0) insumosUsados.push({ insumoId:iid, cantidad:cant });
  });
  const payload = {
    nombre: fd.get('nombre').trim(),
    descripcion: fd.get('descripcion').trim(),
    tiempo_estimado_min: Number(fd.get('tiempoEstimadoMin')),
    precio_venta: Number(fd.get('precioVenta')),
    activo: true
  };
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Guardando…';
  try{
    let tratamientoId = id;
    if(id){
      const { error } = await sb.from('tratamientos').update(payload).eq('id', id);
      if(error) throw error;
      const { error: delErr } = await sb.from('tratamiento_insumos').delete().eq('tratamiento_id', id);
      if(delErr) throw delErr;
    }else{
      const { data, error } = await sb.from('tratamientos').insert(payload).select().single();
      if(error) throw error;
      tratamientoId = data.id;
    }
    if(insumosUsados.length){
      const rows = insumosUsados.map(iu=>({ tratamiento_id:tratamientoId, insumo_id:iu.insumoId, cantidad:iu.cantidad }));
      const { error: insErr } = await sb.from('tratamiento_insumos').insert(rows);
      if(insErr) throw insErr;
    }
    await fetchAll(); closeModal(); render();
  }catch(err){
    alert('No se pudo guardar el tratamiento: ' + err.message);
  }finally{
    btn.disabled = false; btn.textContent = 'Guardar tratamiento';
  }
}

/* ============================= RESERVAS ============================= */
function agendaItemHtml(r){
  const paciente = byId(db.pacientes, r.pacienteId);
  const tratamiento = byId(db.tratamientos, r.tratamientoId);
  const estadoBadge = {
    pendiente:'badge-muted', confirmada:'badge-info', atendida:'badge-success', cancelada:'badge-warning'
  }[r.estado] || 'badge-muted';
  const yaVenta = db.ventas.some(v=>v.reservaId===r.id);
  let actions = `<select class="btn-sm" data-action="reserva-set-estado" data-id="${r.id}" style="padding:5px 8px; font-size:12px;">
      ${['pendiente','confirmada','atendida','cancelada'].map(e=>`<option value="${e}" ${r.estado===e?'selected':''}>${e.charAt(0).toUpperCase()+e.slice(1)}</option>`).join('')}
    </select>
    <button class="btn btn-secondary btn-sm" data-action="reserva-edit" data-id="${r.id}">Editar</button>
    <button class="btn btn-danger btn-sm" data-action="reserva-delete" data-id="${r.id}">Eliminar</button>`;
  if(r.estado==='atendida' && !yaVenta){
    actions = `<button class="btn btn-primary btn-sm" data-action="reserva-registrar-venta" data-id="${r.id}">Registrar venta</button>` + actions;
  }
  return `<div class="agenda-item">
    <div class="agenda-hora">${escapeHtml(r.hora)}</div>
    <div class="agenda-info">
      <div class="ai-paciente">${escapeHtml(paciente?paciente.nombre:'(paciente eliminado)')} <span class="badge ${estadoBadge}">${r.estado}</span> ${yaVenta?'<span class=\"badge badge-success\">Venta registrada</span>':''}</div>
      <div class="ai-detalle">${escapeHtml(tratamiento?tratamiento.nombre:'(tratamiento eliminado)')} ${r.notas? ' · '+escapeHtml(r.notas):''}</div>
    </div>
    <div class="agenda-actions">${actions}</div>
  </div>`;
}

function renderReservas(main){
  let html = `<div class="tabs">
    <div class="tab ${state.reservasSub==='agenda-dia'?'active':''}" data-action="reservas-subview" data-sub="agenda-dia">Agenda del día</div>
    <div class="tab ${state.reservasSub==='agenda-semana'?'active':''}" data-action="reservas-subview" data-sub="agenda-semana">Agenda de la semana</div>
    <div class="tab ${state.reservasSub==='pacientes'?'active':''}" data-action="reservas-subview" data-sub="pacientes">Pacientes</div>
  </div>`;

  if(state.reservasSub==='agenda-dia'){
    html += renderAgendaDia();
  }else if(state.reservasSub==='agenda-semana'){
    html += renderAgendaSemana();
  }else{
    html += renderPacientesTab();
  }

  main.innerHTML = html;

  if(state.reservasSub==='agenda-dia'){
    document.getElementById('agenda-dia-date').addEventListener('change', e=>{
      state.agendaDiaFecha = e.target.value; render();
    });
  }
  if(state.reservasSub==='pacientes'){
    document.getElementById('pacientes-search').addEventListener('input', e=>{
      state.pacientesSearch = e.target.value; render();
    });
  }
}

function renderAgendaDia(){
  const fecha = state.agendaDiaFecha;
  const items = db.reservas.filter(r=>r.fecha===fecha).sort((a,b)=>a.hora.localeCompare(b.hora));
  let html = `<div class="panel">
    <div class="panel-header">
      <h2 class="panel-title">${escapeHtml(formatDateLong(fromISODateLocal(fecha)))}</h2>
      <div style="display:flex; gap:10px; align-items:center;">
        <input type="date" id="agenda-dia-date" value="${fecha}">
        <button class="btn btn-primary" data-action="reserva-new">+ Nueva reserva</button>
      </div>
    </div>`;
  html += items.length ? items.map(agendaItemHtml).join('') : `<div class="empty-state">No hay reservas para este día.</div>`;
  html += `</div>`;
  return html;
}

function renderAgendaSemana(){
  const anchor = state.agendaSemanaAnchor;
  const days = Array.from({length:7}, (_,i)=>addDays(anchor,i));
  const today = todayLocalISO();
  let html = `<div class="panel">
    <div class="panel-header">
      <h2 class="panel-title">Semana del ${formatDateShort(days[0])} al ${formatDateShort(days[6])}</h2>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-secondary btn-sm" data-action="agenda-semana-prev">&larr; Anterior</button>
        <button class="btn btn-secondary btn-sm" data-action="agenda-semana-next">Siguiente &rarr;</button>
        <button class="btn btn-primary" data-action="reserva-new">+ Nueva reserva</button>
      </div>
    </div>
    <div class="week-grid">`;
  days.forEach(d=>{
    const iso = toISODateLocal(d);
    const items = db.reservas.filter(r=>r.fecha===iso).sort((a,b)=>a.hora.localeCompare(b.hora));
    html += `<div class="week-day">
      <div class="week-day-head ${iso===today?'today':''}">${weekdayShort(d)} ${d.getDate()}</div>`;
    if(!items.length){
      html += `<div class="text-suave" style="font-size:11px;">—</div>`;
    }else{
      items.forEach(r=>{
        const paciente = byId(db.pacientes, r.pacienteId);
        html += `<div class="week-item" data-action="reserva-edit" data-id="${r.id}">
          <div class="wi-hora">${escapeHtml(r.hora)}</div>
          <div>${escapeHtml(paciente?paciente.nombre:'—')}</div>
        </div>`;
      });
    }
    html += `</div>`;
  });
  html += `</div></div>`;
  return html;
}

async function saveReservaForm(form, id){
  const fd = new FormData(form);
  const payload = {
    paciente_id: fd.get('pacienteId'),
    tratamiento_id: fd.get('tratamientoId'),
    fecha: fd.get('fecha'),
    hora: fd.get('hora'),
    estado: fd.get('estado'),
    notas: fd.get('notas').trim()
  };
  if(!payload.paciente_id || !payload.tratamiento_id){ alert('Debes seleccionar paciente y tratamiento.'); return; }
  const prevEstado = id ? (byId(db.reservas,id)||{}).estado : null;
  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Guardando…';
  try{
    let reservaId = id;
    if(id){
      const { error } = await sb.from('reservas').update(payload).eq('id', id);
      if(error) throw error;
    }else{
      const { data, error } = await sb.from('reservas').insert(payload).select().single();
      if(error) throw error;
      reservaId = data.id;
    }
    await fetchAll();
    closeModal();
    const reserva = byId(db.reservas, reservaId);
    const yaVenta = db.ventas.some(v=>v.reservaId===reservaId);
    if(reserva && reserva.estado==='atendida' && !yaVenta && prevEstado!=='atendida'){
      if(confirm('La reserva quedó marcada como "atendida". ¿Deseas registrar la venta ahora con estos datos?')){
        openVentaForm({ pacienteId:reserva.pacienteId, tratamientoIds:[reserva.tratamientoId], fecha:reserva.fecha, reservaId:reserva.id });
        return;
      }
    }
    render();
  }catch(err){
    alert('No se pudo guardar la reserva: ' + err.message);
  }finally{
    btn.disabled = false; btn.textContent = 'Guardar reserva';
  }
}

async function setReservaEstado(id, estado){
  const reserva = byId(db.reservas, id);
  if(!reserva) return;
  const prevEstado = reserva.estado;
  try{
    const { error } = await sb.from('reservas').update({ estado }).eq('id', id);
    if(error) throw error;
    await fetchAll();
    const fresh = byId(db.reservas, id);
    const yaVenta = db.ventas.some(v=>v.reservaId===id);
    if(fresh && estado==='atendida' && !yaVenta && prevEstado!=='atendida'){

        openVentaForm({ pacienteId:fresh.pacienteId, tratamientoIds:[fresh.tratamientoId], fecha:fresh.fecha, reservaId:fresh.id });
        return;

    render();
  }catch(err){

    render();
  }
}

async function saveVentaForm(form){
  const fd = new FormData(form);
  const pacienteId = fd.get('pacienteId');
  const tratamientoIds = fd.getAll('tratamientoId[]').filter(Boolean);
  if(!pacienteId){ alert('Debes seleccionar un paciente.'); return; }
  if(!tratamientoIds.length){ alert('Debes agregar al menos un tratamiento.'); return; }

  const tratamientosLinea = [];
  let montoTotal = 0;
  tratamientoIds.forEach(tid=>{
    const t = byId(db.tratamientos, tid);
    if(t){ tratamientosLinea.push({ tratamientoId:t.id, precio:Number(t.precioVenta) }); montoTotal += Number(t.precioVenta); }
  });
  const fecha = fd.get('fecha');

  const btn = form.querySelector('button[type=submit]');
  btn.disabled = true; btn.textContent = 'Guardando…';
  try{
    const { data: ventaRow, error: ventaErr } = await sb.from('ventas').insert({
      fecha, paciente_id: pacienteId, metodo_pago: fd.get('metodoPago'),
      monto_total: montoTotal, reserva_id: form.dataset.reservaId || null
    }).select().single();
    if(ventaErr) throw ventaErr;
    const ventaId = ventaRow.id;

    const vtRows = tratamientosLinea.map(l=>({ venta_id:ventaId, tratamiento_id:l.tratamientoId, precio:l.precio }));
    const { error: vtErr } = await sb.from('venta_tratamientos').insert(vtRows);
    if(vtErr) throw vtErr;

    for(const linea of tratamientosLinea){
      const t = byId(db.tratamientos, linea.tratamientoId);
      if(!t) continue;
      for(const iu of (t.insumosUsados||[])){
        const insumo = byId(db.insumos, iu.insumoId);
        if(!insumo) continue;
        const contenido = Number(insumo.contenidoPorEnvase)||1;
        const dosis = Number(iu.cantidad);
        const cantidadCompra = dosis / contenido;
        const nuevoStock = Number(insumo.stockActual) - cantidadCompra;
        const { error: updErr } = await sb.from('insumos').update({ stock_actual: nuevoStock }).eq('id', insumo.id);
        if(updErr) throw updErr;
        const { error: movErr } = await sb.from('movimientos_inventario').insert({
          insumo_id: insumo.id, tipo:'salida', cantidad:cantidadCompra,
          motivo: `Venta — ${t.nombre} (${formatNum(dosis)} ${insumo.unidadDosis})`, referencia_id: ventaId, fecha
        });
        if(movErr) throw movErr;
        insumo.stockActual = nuevoStock;
      }
    }

    await fetchAll(); closeModal(); render();
  }catch(err){
    alert('No se pudo registrar la venta: ' + err.message);
  }finally{
    btn.disabled = false; btn.textContent = 'Registrar venta';
  }
}

async function deleteVenta(id){
  const venta = byId(db.ventas, id);
  if(!venta) return;
  if(!confirm('¿Anular esta venta? Se repondrá el stock de insumos utilizados.')) return;
  try{
    for(const linea of venta.tratamientos){
      const t = byId(db.tratamientos, linea.tratamientoId);
      if(!t) continue;
      for(const iu of (t.insumosUsados||[])){
        const insumo = byId(db.insumos, iu.insumoId);
        if(!insumo) continue;
        const contenido = Number(insumo.contenidoPorEnvase)||1;
        const dosis = Number(iu.cantidad);
        const cantidadCompra = dosis / contenido;
        const nuevoStock = Number(insumo.stockActual) + cantidadCompra;
        const { error: updErr } = await sb.from('insumos').update({ stock_actual: nuevoStock }).eq('id', insumo.id);
        if(updErr) throw updErr;
        const { error: movErr } = await sb.from('movimientos_inventario').insert({
          insumo_id: insumo.id, tipo:'entrada', cantidad:cantidadCompra,
          motivo: `Anulación de venta — ${t.nombre} (${formatNum(dosis)} ${insumo.unidadDosis})`, referencia_id: venta.id, fecha: todayLocalISO()
        });
        if(movErr) throw movErr;
        insumo.stockActual = nuevoStock;
      }
    }
    const { error } = await sb.from('ventas').delete().eq('id', id);
    if(error) throw error;
    await fetchAll(); render();
  }catch(err){
    alert('No se pudo anular la venta: ' + err.message);
  }
}

function getReportRange(period, offset){
  const now = new Date(); now.setHours(0,0,0,0);
  if(period==='dia'){
    const d = addDays(now, -offset);
    return { start:d, end:d, label: formatDateLong(d) };
  }else if(period==='semana'){
    const thisWeekStart = startOfWeek(now);
    const start = addDays(thisWeekStart, -7*offset);
    const end = addDays(start,6);
    return { start, end, label: `${formatDateShort(start)} — ${formatDateShort(end)}` };
  }else{
    const base = new Date(now.getFullYear(), now.getMonth()-offset, 1);
    const start = new Date(base.getFullYear(), base.getMonth(), 1);
    const end = new Date(base.getFullYear(), base.getMonth()+1, 0);
    const label = base.toLocaleDateString('es-CL',{ month:'long', year:'numeric' });
    return { start, end, label: label.charAt(0).toUpperCase()+label.slice(1) };
  }
}

function renderVentas(main){
  let html = `<div class="panel">
    <div class="panel-header">
      <h2 class="panel-title">Registrar venta</h2>
      <button class="btn btn-primary" data-action="venta-new">+ Nueva venta</button>
    </div>
    <p class="text-suave" style="margin:0; font-size:13px;">Al registrar una venta se descuenta automáticamente el stock de los insumos usados por el tratamiento.</p>
  </div>`;

  const range = getReportRange(state.ventasReportPeriod, state.ventasReportOffset);
  const startISO = toISODateLocal(range.start), endISO = toISODateLocal(range.end);
  const ventasRango = db.ventas.filter(v=> v.fecha>=startISO && v.fecha<=endISO);
  const totalRango = ventasRango.reduce((s,v)=>s+Number(v.montoTotal),0);

  html += `<div class="panel">
    <div class="panel-header">
      <h2 class="panel-title">Reporte de ventas</h2>
      <div class="tabs" style="border-bottom:none; margin:0;">
        ${['dia','semana','mes'].map(p=>`<div class="tab ${state.ventasReportPeriod===p?'active':''}" data-action="ventas-report-tab" data-period="${p}">${p==='dia'?'Día':p==='semana'?'Semana':'Mes'}</div>`).join('')}
      </div>
    </div>
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;">
      <div style="display:flex; align-items:center; gap:10px;">
        <button class="btn btn-secondary btn-sm" data-action="ventas-report-prev">&larr;</button>
        <strong>${escapeHtml(range.label)}</strong>
        <button class="btn btn-secondary btn-sm" data-action="ventas-report-next" ${state.ventasReportOffset<=0?'disabled':''}>&rarr;</button>
      </div>
      <div class="card-value" style="font-size:22px;">${formatCLP(totalRango)}</div>
    </div>`;

  if(state.ventasReportPeriod==='dia'){
    if(!ventasRango.length){
      html += `<div class="empty-state">Sin ventas en este día.</div>`;
    }else{
      html += ventasTableHtml(ventasRango);
    }
  }else{
    const bars = [];
    if(state.ventasReportPeriod==='semana'){
      for(let i=0;i<7;i++){
        const d = addDays(range.start,i);
        const iso = toISODateLocal(d);
        const total = db.ventas.filter(v=>v.fecha===iso).reduce((s,v)=>s+Number(v.montoTotal),0);
        bars.push({ label: weekdayShort(d), value: total });
      }
    }else{
      const daysInMonth = range.end.getDate();
      for(let day=1; day<=daysInMonth; day++){
        const d = new Date(range.start.getFullYear(), range.start.getMonth(), day);
        const iso = toISODateLocal(d);
        const total = db.ventas.filter(v=>v.fecha===iso).reduce((s,v)=>s+Number(v.montoTotal),0);
        bars.push({ label: String(day), value: total });
      }
    }
    const max = Math.max(1, ...bars.map(b=>b.value));
    html += `<div class="bar-chart">${bars.map(b=>`
      <div class="bar-col" title="${escapeHtml(b.label)}: ${formatCLP(b.value)}">
        ${b.value>0?`<div class="bar-val">${formatNum(Math.round(b.value/1000))}k</div>`:''}
        <div class="bar" style="height:${Math.max(2,(b.value/max*100))}%;"></div>
        <div class="bar-lbl">${escapeHtml(b.label)}</div>
      </div>`).join('')}</div>`;
  }
  html += `</div>`;

  const recientes = [...db.ventas].sort((a,b)=> b.fecha.localeCompare(a.fecha)).slice(0,40);
  html += `<div class="panel"><h2 class="panel-title">Historial de ventas</h2>`;
  html += recientes.length ? ventasTableHtml(recientes) : `<div class="empty-state">Aún no hay ventas registradas.</div>`;
  html += `</div>`;

  main.innerHTML = html;
}

function ventasTableHtml(ventas){
  const sorted = [...ventas].sort((a,b)=> b.fecha.localeCompare(a.fecha));
  let html = `<div class="table-wrap"><table><thead><tr>
    <th>Fecha</th><th>Paciente</th><th>Tratamiento(s)</th><th>Método de pago</th><th class="num">Monto</th><th></th>
  </tr></thead><tbody>`;
  sorted.forEach(v=>{
    const paciente = byId(db.pacientes, v.pacienteId);
    const nombres = v.tratamientos.map(l=>{ const t=byId(db.tratamientos,l.tratamientoId); return t?t.nombre:'(eliminado)'; }).join(', ');
    html += `<tr>
      <td>${escapeHtml(v.fecha)}</td>
      <td>${escapeHtml(paciente?paciente.nombre:'(paciente eliminado)')}</td>
      <td>${escapeHtml(nombres)}</td>
      <td>${escapeHtml(v.metodoPago)}</td>
      <td class="num">${formatCLP(v.montoTotal)}</td>
      <td><div class="row-actions"><button class="btn btn-danger btn-sm" data-action="venta-delete" data-id="${v.id}">Anular</button></div></td>
    </tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

async function importBackupFile(file){
  let parsed;
  try{
    parsed = JSON.parse(await file.text());
  }catch(e){
    alert('El archivo no es un JSON válido.');
    return;
  }
  const required = ['insumos','tratamientos','pacientes','reservas','ventas'];
  if(!required.some(k=>k in parsed)){ alert('El archivo no tiene el formato esperado.'); return; }
  if(!confirm('Esto reemplazará TODOS los datos actuales en la base de datos en la nube (todos los dispositivos) por los del archivo importado. Esta acción no se puede deshacer. ¿Continuar?')) return;

  try{
    await sb.from('venta_tratamientos').delete().not('id','is',null);
    await sb.from('tratamiento_insumos').delete().not('id','is',null);
    await sb.from('movimientos_inventario').delete().not('id','is',null);
    await sb.from('ventas').delete().not('id','is',null);
    await sb.from('reservas').delete().not('id','is',null);
    await sb.from('tratamientos').delete().not('id','is',null);
    await sb.from('pacientes').delete().not('id','is',null);
    await sb.from('insumos').delete().not('id','is',null);

    if(parsed.insumos && parsed.insumos.length){
      const rows = parsed.insumos.map(i=>({ id:i.id, nombre:i.nombre, categoria:i.categoria, unidad_medida:i.unidadMedida, unidad_dosis:i.unidadDosis||i.unidadMedida, stock_actual:i.stockActual, stock_minimo:i.stockMinimo, costo_unitario:i.costoUnitario, merma_porcentaje:i.mermaPorcentaje||0, contenido_por_envase:i.contenidoPorEnvase||1, proveedor:i.proveedor }));
      const { error } = await sb.from('insumos').insert(rows);
      if(error) throw error;
    }
    if(parsed.pacientes && parsed.pacientes.length){
      const rows = parsed.pacientes.map(p=>({ id:p.id, nombre:p.nombre, telefono:p.telefono, email:p.email, notas:p.notas }));
      const { error } = await sb.from('pacientes').insert(rows);
      if(error) throw error;
    }
    if(parsed.tratamientos && parsed.tratamientos.length){
      const rows = parsed.tratamientos.map(t=>({ id:t.id, nombre:t.nombre, descripcion:t.descripcion, tiempo_estimado_min:t.tiempoEstimadoMin, precio_venta:t.precioVenta, activo: t.activo !== false }));
      const { error } = await sb.from('tratamientos').insert(rows);
      if(error) throw error;
      const triRows = [];
      parsed.tratamientos.forEach(t=>(t.insumosUsados||[]).forEach(iu=>triRows.push({ tratamiento_id:t.id, insumo_id:iu.insumoId, cantidad:iu.cantidad })));
      if(triRows.length){ const { error:e2 } = await sb.from('tratamiento_insumos').insert(triRows); if(e2) throw e2; }
    }
    if(parsed.reservas && parsed.reservas.length){
      const rows = parsed.reservas.map(r=>({ id:r.id, paciente_id:r.pacienteId, tratamiento_id:r.tratamientoId, fecha:r.fecha, hora:r.hora, estado:r.estado, notas:r.notas }));
      const { error } = await sb.from('reservas').insert(rows);
      if(error) throw error;
    }
    if(parsed.ventas && parsed.ventas.length){
      const rows = parsed.ventas.map(v=>({ id:v.id, fecha:v.fecha, paciente_id:v.pacienteId, metodo_pago:v.metodoPago, monto_total:v.montoTotal, reserva_id:v.reservaId }));
      const { error } = await sb.from('ventas').insert(rows);
      if(error) throw error;
      const vtRows = [];
      parsed.ventas.forEach(v=>(v.tratamientos||[]).forEach(l=>vtRows.push({ venta_id:v.id, tratamiento_id:l.tratamientoId, precio:l.precio })));
      if(vtRows.length){ const { error:e2 } = await sb.from('venta_tratamientos').insert(vtRows); if(e2) throw e2; }
    }
    if(parsed.movimientosInventario && parsed.movimientosInventario.length){
      const rows = parsed.movimientosInventario.map(m=>({ id:m.id, insumo_id:m.insumoId, tipo:m.tipo, cantidad:m.cantidad, motivo:m.motivo, referencia_id:m.referenciaId, fecha:m.fecha }));
      const { error } = await sb.from('movimientos_inventario').insert(rows);
      if(error) throw error;
    }

    await fetchAll();
    state.view = 'dashboard';
    render();
    alert('Respaldo importado correctamente.');
  }catch(err){
    alert('No se pudo importar el respaldo (puede haber quedado parcialmente aplicado): ' + err.message);
    try{ await fetchAll(); render(); }catch(e){}
  }
}

/* ============================= EVENT DELEGATION ============================= */
document.addEventListener('click', async function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  switch(action){
    case 'nav': state.view = el.dataset.view; render(); closeSidebar(); break;
    case 'modal-close': closeModal(); break;
    case 'logout': unsubscribeRealtime(); await sb.auth.signOut(); break;

    case 'export-backup': await exportBackup(); break;
    case 'import-backup': document.getElementById('import-file-input').click(); break;

    case 'insumo-new': openInsumoForm(null); break;
    case 'insumo-edit': openInsumoForm(id); break;
    case 'insumo-delete': await deleteInsumo(id); break;
    case 'insumo-adjust': openAjusteStockForm(id); break;

    case 'tratamiento-new': openTratamientoForm(null); break;
    case 'tratamiento-edit': openTratamientoForm(id); break;
    case 'tratamiento-delete': await deleteTratamiento(id); break;
    case 'tratamiento-sort':
      state.tratamientosSortDir = state.tratamientosSortDir==='desc'?'asc':'desc';
      render();
      break;
    case 'tratamiento-add-row':
      document.getElementById('tr-insumos-rows').insertAdjacentHTML('beforeend', tratamientoInsumoRowHtml());
      updateTratamientoPreview();
      break;
    case 'tratamiento-remove-row':
      el.closest('[data-row="insumo"]').remove();
      updateTratamientoPreview();
      break;

    case 'paciente-new': openPacienteForm(null); break;
    case 'paciente-edit': openPacienteForm(id); break;
    case 'paciente-delete': await deletePaciente(id); break;

    case 'reservas-subview': state.reservasSub = el.dataset.sub; render(); break;
    case 'reserva-new': openReservaForm(null); break;
    case 'reserva-edit': openReservaForm(id); break;
    case 'reserva-delete': await deleteReserva(id); break;
    case 'reserva-registrar-venta': {
      const r = byId(db.reservas, id);
      if(r) openVentaForm({ pacienteId:r.pacienteId, tratamientoIds:[r.tratamientoId], fecha:r.fecha, reservaId:r.id });
      break;
    }
    case 'reserva-nuevo-paciente': {
      const form = el.closest('form');
      const fd = new FormData(form);
      state.formDraft = {
        id: form.dataset.id || null,
        tratamientoId: fd.get('tratamientoId'),
        fecha: fd.get('fecha'), hora: fd.get('hora'), estado: fd.get('estado'), notas: fd.get('notas')
      };
      closeModal();
      openPacienteForm(null, 'reserva');
      break;
    }
    case 'agenda-semana-prev': state.agendaSemanaAnchor = addDays(state.agendaSemanaAnchor,-7); render(); break;
    case 'agenda-semana-next': state.agendaSemanaAnchor = addDays(state.agendaSemanaAnchor,7); render(); break;

    case 'venta-new': openVentaForm(); break;
    case 'venta-delete': await deleteVenta(id); break;
    case 'venta-add-row':
      document.getElementById('venta-tratamientos-rows').insertAdjacentHTML('beforeend', ventaTratamientoRowHtml());
      updateVentaPreview();
      break;
    case 'venta-remove-row':
      el.closest('[data-row="venta-tratamiento"]').remove();
      updateVentaPreview();
      break;
    case 'venta-nuevo-paciente': {
      const form = el.closest('form');
      const fd = new FormData(form);
      state.formDraft = {
        tratamientoIds: fd.getAll('tratamientoId[]').filter(Boolean),
        fecha: fd.get('fecha'),
        reservaId: form.dataset.reservaId || null
      };
      closeModal();
      openPacienteForm(null, 'venta');
      break;
    }

    case 'ventas-report-tab': state.ventasReportPeriod = el.dataset.period; state.ventasReportOffset = 0; render(); break;
    case 'ventas-report-prev': state.ventasReportOffset++; render(); break;
    case 'ventas-report-next': state.ventasReportOffset = Math.max(0, state.ventasReportOffset-1); render(); break;
  }
});

document.addEventListener('change', async function(e){
  if(e.target.matches('[data-action="reserva-set-estado"]')){
    await setReservaEstado(e.target.dataset.id, e.target.value);
  }
});

document.addEventListener('submit', async function(e){
  if(e.target.id !== 'modal-form') return;
  e.preventDefault();
  const form = e.target;
  const entity = form.dataset.entity;
  const id = form.dataset.id || null;
  if(entity==='insumo') await saveInsumoForm(form, id);
  else if(entity==='ajuste-insumo') await saveAjusteStockForm(form, id);
  else if(entity==='tratamiento') await saveTratamientoForm(form, id);
  else if(entity==='paciente') await savePacienteForm(form, id);
  else if(entity==='reserva') await saveReservaForm(form, id);
  else if(entity==='venta') await saveVentaForm(form);
});

document.getElementById('import-file-input').addEventListener('change', async function(e){
  const file = e.target.files[0];
  if(file) await importBackupFile(file);
  e.target.value = '';
});

document.getElementById('modal-overlay').addEventListener('click', function(e){
  if(e.target.id === 'modal-overlay') closeModal();
});

/* ============================= MENÚ MÓVIL ============================= */
function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('sidebar-backdrop').classList.add('open');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-backdrop').classList.remove('open');
}
document.getElementById('hamburger-btn').addEventListener('click', openSidebar);
document.getElementById('sidebar-backdrop').addEventListener('click', closeSidebar);

/* ============================= INIT ============================= */
initAuth();

})();
</script>
</body>
</html>
